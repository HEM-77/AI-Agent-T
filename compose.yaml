
services:
  mongodb:
    image: mongo:8
    container_name: task-dashboard-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: taskadmin
      MONGO_INITDB_ROOT_PASSWORD: localdevpassword
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db

volumes:
  mongodb_data: